- name: Install a single-node K3s cluster
  hosts: k3s
  become: true
  gather_facts: true
  tasks:
    - name: Validate the bootstrap target
      ansible.builtin.assert:
        that:
          - groups['k3s'] | length == 1
          - ansible_facts.os_family == 'Debian'
          - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
        fail_msg: Use one Debian/Ubuntu host and specify a pinned K3s version.

    - name: Install bootstrap dependencies
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: true

    - name: Check whether K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Download K3s installer for a fresh installation
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /root/install-k3s.sh
        mode: '0700'
      when: not k3s_binary.stat.exists

    - name: Install the pinned K3s server
      ansible.builtin.command: /bin/sh /root/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: '{{ k3s_version }}'
        INSTALL_K3S_EXEC: server --write-kubeconfig-mode=600 --secrets-encryption
      when: not k3s_binary.stat.exists
      changed_when: true

    - name: Enable K3s
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true

    - name: Wait for the single node to become ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      register: node_ready
      retries: 5
      delay: 10
      until: node_ready.rc == 0
      changed_when: false
